#cloud-config

# sets the hostname to 'terraformed'
hostname: vm-web
#mdp=arbia
network:
  version: 2
  ethernets:
    ens192:
      routes:
        - to: 192.168.100.0/24
          via: 192.168.90.11


ssh_pwauth: false
users:
# Adds a user called 'example' with the password hash of 'p$6$rounds=4096$P0uvlB9.8nsiY67$uuOxYSk6n/74Ds3JtV1mT6xYjOguwTWgNmOeHvcHiQa9zan57l8dvfHE/zlu19fDmJGySNzLmh6K0R2I1AU9o0asswort', sudo rights and the default ubuntu groups
        - name: arbeya
          passwd: $6$BeycaO9enqABUXBu$P.xJqF0FVMYPqabGS2IoAV41Kxq3k/VR8xRgbWkd.T01wzP9vLJMvl4zsk5f001ceIhgcD4GCE03K4iDUfm5s.
          lock_passwd: false 
          sudo: ALL=(ALL) ALL
          groups: [adm, audio, cdrom, dialout, floppy, video, plugdev, dip, netdev]

        - name: ansible
          gecos: Ansible User
          groups: users,admin,wheel
          sudo: "ALL=(ALL) NOPASSWD:ALL"
          shell: /bin/bash
          lock_passwd: true
          ssh_authorized_keys:
          - "ssh-rsa  arbeya@arbeya-virtual-machine"



runcmd:
  - ip route add 192.168.80.0/24 via 192.168.90.11 dev ens192
  
  


 




